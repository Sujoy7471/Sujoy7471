<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Sujoy K Official Website</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        background: black;
    }

    canvas {
        display: block;
    }
</style>
</head>

<body>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from 'three';

import { EffectComposer }
from 'three/addons/postprocessing/EffectComposer.js';

import { RenderPass }
from 'three/addons/postprocessing/RenderPass.js';

import { UnrealBloomPass }
from 'three/addons/postprocessing/UnrealBloomPass.js';


// =====================================================
// SCENE
// =====================================================

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    90,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(-5, 10, 40);

camera.rotation.z =
    THREE.MathUtils.degToRad(-30);

camera.rotation.x =
    THREE.MathUtils.degToRad(-25);

camera.rotation.y =
    THREE.MathUtils.degToRad(-5);


// =====================================================
// RENDERER
// =====================================================

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document.body.appendChild(
    renderer.domElement
);

renderer.autoClear = false;


// =====================================================
// DISK
// =====================================================

const discParticleCount = 250000;

const positions =
    new Float32Array(
        discParticleCount * 3
    );

const colors =
    new Float32Array(
        discParticleCount * 3
    );

const color = new THREE.Color();

const initialAngles = [];
const radii = [];
const angularSpeeds = [];

for (let i = 0; i < discParticleCount; i++) {

    const radius =
        THREE.MathUtils.randFloat(10, 40);

    const angle =
        THREE.MathUtils.randFloat(
            0,
            2 * Math.PI
        );

    const height =
        THREE.MathUtils.randFloatSpread(
            4 - radius / 40
        );

    positions[i*3] =
        radius * Math.cos(angle);

    positions[i*3+1] =
        height;

    positions[i*3+2] =
        radius * Math.sin(angle);

    initialAngles.push(angle);

    radii.push(radius);

    angularSpeeds.push(
        5 / Math.sqrt(
            radius*radius*radius - 9.5
        )
    );

    const t = radius / 40;

    color.setHSL(
        1.2
        + 0.1*Math.random()
        - 0.4*t,

        0.8,

        0.6 - t*0.7
    );

    colors.set(
        [color.r,color.g,color.b],
        i*3
    );
}

const discGeometry =
    new THREE.BufferGeometry();

discGeometry.setAttribute(
    'position',
    new THREE.BufferAttribute(
        positions,
        3
    )
);

discGeometry.setAttribute(
    'color',
    new THREE.BufferAttribute(
        colors,
        3
    )
);

const discMaterial =
    new THREE.PointsMaterial({

    size:0.12,

    vertexColors:true,

    transparent:true,

    opacity:0.125,

    depthWrite:false,

    blending:
        THREE.AdditiveBlending
});

const disc =
    new THREE.Points(
        discGeometry,
        discMaterial
    );

disc.rotation.x =
    THREE.MathUtils.degToRad(10);

scene.add(disc);


// =====================================================
// STAR
// =====================================================

const star =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            2.2,
            64,
            64
        ),

        new THREE.MeshBasicMaterial({
            color:0xffeeaa
        })
    );

scene.add(star);


// =====================================================
// GLOW
// =====================================================

const glow =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            4.5,
            64,
            64
        ),

        new THREE.MeshBasicMaterial({

            color:0xffaa33,

            transparent:true,

            opacity:0.015,

            blending:
                THREE.AdditiveBlending,

            depthWrite:false
        })
    );

scene.add(glow);


// =====================================================
// CORONA
// =====================================================

const corona =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            8,
            64,
            64
        ),

        new THREE.MeshBasicMaterial({

            color:0xff6600,

            transparent:true,

            opacity:0.09,

            blending:
                THREE.AdditiveBlending,

            depthWrite:false
        })
    );

scene.add(corona);


// =====================================================
// JET AXIS
// =====================================================

const jetAxis =
    new THREE.Vector3(
        0.035,
        1.2,
        -0.14
    ).normalize();


// =====================================================
// BASIS VECTORS
// =====================================================

const perp1 =
    new THREE.Vector3(1,0,0)
    .cross(jetAxis)
    .normalize();

const perp2 =
    jetAxis.clone()
    .cross(perp1)
    .normalize();


// =====================================================
// COLLIMATED JETS
// =====================================================

const jetParticleCount = 10000;

const jetPositions =
    new Float32Array(
        jetParticleCount * 3
    );

const jetColors =
    new Float32Array(
        jetParticleCount * 3
    );

const jetVelocities = [];
const jetDirections = [];
const jetOffsets = [];

const jetColor =
    new THREE.Color();

for(let i=0;i<jetParticleCount;i++){

    const dir =
        Math.random()<0.5
        ? 1
        : -1;

    const spread = 1;

    const r =
        Math.random()*spread;

    const theta =
        Math.random()*2*Math.PI;

    const offset =
        perp1.clone()
        .multiplyScalar(
            r*Math.cos(theta)
        )

        .add(
            perp2.clone()
            .multiplyScalar(
                r*Math.sin(theta)
            )
        );

    const launch =
        dir*Math.random()*140;

    const base =
        jetAxis.clone()
        .multiplyScalar(launch);

    const pos =
        base.add(offset);

    jetPositions[i*3] = pos.x;
    jetPositions[i*3+1] = pos.y;
    jetPositions[i*3+2] = pos.z;

    jetVelocities.push(
        dir * (
            0.45
            + Math.random()*0.55
        )
    );

    jetDirections.push(dir);

    jetOffsets.push(offset);

    const t = Math.random();

    jetColor.setHSL(
        0.78,
        1.0,
        0.6
    );

    const brightness =
        dir === 1
        ? 1.0
        : 0.18;

    jetColors[i*3] =
        jetColor.r * brightness;

    jetColors[i*3+1] =
        jetColor.g * brightness;

    jetColors[i*3+2] =
        jetColor.b * brightness;
}

const jetGeometry =
    new THREE.BufferGeometry();

jetGeometry.setAttribute(
    'position',
    new THREE.BufferAttribute(
        jetPositions,
        3
    )
);

jetGeometry.setAttribute(
    'color',
    new THREE.BufferAttribute(
        jetColors,
        3
    )
);

const jetMaterial =
    new THREE.PointsMaterial({

    size:0.15,

    vertexColors:true,

    transparent:true,

    opacity:0.31,

    depthWrite:false,

    blending:
        THREE.AdditiveBlending
});

const jets =
    new THREE.Points(
        jetGeometry,
        jetMaterial
    );

scene.add(jets);


// =====================================================
// WIDE ANGLE OUTFLOW
// =====================================================

const flowParticleCount = 50000;

const flowPositions =
    new Float32Array(
        flowParticleCount * 3
    );

const flowColors =
    new Float32Array(
        flowParticleCount * 3
    );

const flowVelocities = [];
const flowDirections = [];
const flowThetas = [];
const flowRadii = [];
const flowZs = [];

const flowColor =
    new THREE.Color();

for(let i=0;i<flowParticleCount;i++){

    const dir =
        Math.random()<0.5
        ? 1
        : -1;

    const r =
        Math.random()*10;

    const theta =
        Math.random()*2*Math.PI;

    const z =
        dir * (
            0.12 * r * r
        );

    flowRadii.push(r);
    flowThetas.push(theta);
    flowZs.push(z);

    const x =
        r*Math.cos(theta);

    const y =
        r*Math.sin(theta);

    const pos =
        perp1.clone()
        .multiplyScalar(x)

        .add(
            perp2.clone()
            .multiplyScalar(y)
        )

        .add(
            jetAxis.clone()
            .multiplyScalar(z)
        );

    flowPositions[i*3] = pos.x;
    flowPositions[i*3+1] = pos.y;
    flowPositions[i*3+2] = pos.z;

    flowVelocities.push(
        dir * (
            0.5
            + Math.random()*0.15
        )
    );

    flowDirections.push(dir);

    const t = Math.random();

    flowColor.setHSL(
        1.2
        + 0.1*Math.random()
        - 0.4*t,

        0.8 - t*0.25,

        0.86 - t*0.7
    );

    const brightness =
        dir === 1
        ? 0.42
        : 0.18 * 0.32;

    flowColors[i*3] =
        flowColor.r * brightness;

    flowColors[i*3+1] =
        flowColor.g * brightness;

    flowColors[i*3+2] =
        flowColor.b * brightness;
}

const flowGeometry =
    new THREE.BufferGeometry();

flowGeometry.setAttribute(
    'position',
    new THREE.BufferAttribute(
        flowPositions,
        3
    )
);

flowGeometry.setAttribute(
    'color',
    new THREE.BufferAttribute(
        flowColors,
        3
    )
);

const flowMaterial =
    new THREE.PointsMaterial({

    size:0.30,

    vertexColors:true,

    transparent:true,

    opacity:0.06,

    depthWrite:false,

    blending:
        THREE.AdditiveBlending
});

const outflow =
    new THREE.Points(
        flowGeometry,
        flowMaterial
    );

scene.add(outflow);


// =====================================================
// BLOOM
// =====================================================

const composer =
    new EffectComposer(renderer);

composer.addPass(
    new RenderPass(scene,camera)
);

composer.addPass(
    new UnrealBloomPass(
        new THREE.Vector2(
            window.innerWidth,
            window.innerHeight
        ),
        0.9,
        0.35,
        0.12
    )
);


// =====================================================
// CLOCK
// =====================================================

const clock =
    new THREE.Clock();


// =====================================================
// ANIMATION
// =====================================================

function animate(){

    requestAnimationFrame(animate);

    const elapsedTime =
        clock.getElapsedTime();


    // ---------------------------------
    // DISK ROTATION
    // ---------------------------------

    const pos =
        discGeometry.attributes.position.array;

    for(let i=0;i<discParticleCount;i++){

        let angle =
            initialAngles[i]
            - angularSpeeds[i]
            * elapsedTime;

        let r = radii[i];

        pos[i*3] =
            r*Math.cos(angle);

        pos[i*3+2] =
            r*Math.sin(angle);
    }

    discGeometry
        .attributes
        .position
        .needsUpdate = true;


    // ---------------------------------
    // JETS
    // ---------------------------------

    const jetPos =
        jetGeometry.attributes.position.array;

    for(let i=0;i<jetParticleCount;i++){

        const dir =
            jetDirections[i];

        const speed =
            jetVelocities[i];

        jetPos[i*3] +=
            jetAxis.x * speed;

        jetPos[i*3+1] +=
            jetAxis.y * speed;

        jetPos[i*3+2] +=
            jetAxis.z * speed;

        const dist =
            Math.sqrt(
                jetPos[i*3]**2 +
                jetPos[i*3+1]**2 +
                jetPos[i*3+2]**2
            );

        const widen =
            0.05 * dist;

        jetPos[i*3] +=
            (Math.random()-0.5)
            * widen;

        jetPos[i*3+1] +=
            (Math.random()-0.5)
            * widen;

        jetPos[i*3+2] +=
            (Math.random()-0.5)
            * widen;

        if(dist > 140){

            const launch =
                dir*Math.random()*2;

            const base =
                jetAxis.clone()
                .multiplyScalar(launch);

            const offset =
                jetOffsets[i];

            const p =
                base.add(offset);

            jetPos[i*3] = p.x;
            jetPos[i*3+1] = p.y;
            jetPos[i*3+2] = p.z;
        }
    }

    jetGeometry
        .attributes
        .position
        .needsUpdate = true;


    // ---------------------------------
    // CONTINUOUS WIDE ANGLE OUTFLOW
    // ---------------------------------

    const flowPos =
        flowGeometry.attributes.position.array;

    for(let i=0;i<flowParticleCount;i++){

        const dir =
            flowDirections[i];

        // move outward from center

        flowZs[i] +=
            flowVelocities[i];

        // paraboloid radius

        const r =
            Math.sqrt(
                Math.abs(
                    flowZs[i] / 0.025
                )
            );

        const theta =
            flowThetas[i];

        const x =
            r * Math.cos(theta);

        const y =
            r * Math.sin(theta);

        // convert to world coordinates

        const p =
            perp1.clone()
            .multiplyScalar(x)

            .add(
                perp2.clone()
                .multiplyScalar(y)
            )

            .add(
                jetAxis.clone()
                .multiplyScalar(
                    flowZs[i]
                )
            );

        flowPos[i*3] = p.x;
        flowPos[i*3+1] = p.y;
        flowPos[i*3+2] = p.z;

        // recycle continuously from center

        if(Math.abs(flowZs[i]) > 70){

            flowZs[i] =
                dir * (
                    Math.random() * 1.5
                );

            flowThetas[i] =
                Math.random()
                * 2 * Math.PI;
        }
    }

    flowGeometry
        .attributes
        .position
        .needsUpdate = true;


    renderer.clear();

    composer.render();
}

animate();


// =====================================================
// RESIZE
// =====================================================

window.addEventListener(
    'resize',
    ()=>{

        camera.aspect =
            window.innerWidth
            / window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
