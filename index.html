<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Sujoy K Official Website</title>

<style>

body{

    margin:0;

    overflow:hidden;

    background:black;

    font-family:Arial,sans-serif;
}



/* =======================================
   VIDEO BACKGROUND
======================================= */

#bgVideo{

    position:fixed;

    inset:0;

    width:100%;

    height:100%;

    object-fit:cover;

    transform:scale(1.02);

    z-index:-10;
}



/* =======================================
   FLOATING MENU
======================================= */

#ui-container{

    position:fixed;

    inset:0;

    display:flex;

    justify-content:center;

    align-items:center;

    pointer-events:none;

    z-index:1000;
}


.menu-box{

    width:760px;

    height:58px;

    border-radius:35px;

    background:
        rgba(160,83,199,0.045);

    border:
        1px solid
        rgba(255,255,255,0.10);

    backdrop-filter:blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    box-shadow:
        0 0 40px rgba(202,92,227,0.05),
        inset 0 0 25px rgba(222,149,228,0.03);

    display:flex;

    justify-content:space-evenly;

    align-items:center;

    transition:
        opacity 0.8s ease,
        transform 0.3s ease;

    opacity:0.92;

    pointer-events:auto;
}


.menu-item{

    color:white;

    text-decoration:none;

    font-size:20px;

    letter-spacing:1px;

    padding:
        10px 22px;

    border-radius:16px;

    transition:
        all 0.35s ease;
}


.menu-item:hover{

    color:white;

    background:
        rgba(255,255,255,0.08);

    box-shadow:
        0 0 22px
        rgba(180,120,255,0.22);

    transform:
        translateY(-2px)
        scale(1.04);
}



/* =======================================
   HIDE BUTTON
======================================= */

#fadeButton{

    position:fixed;

    top:24px;

    right:24px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:4px;

    width:74px;

    height:74px;

    border-radius:22px;

    border:none;

    outline:none;

    background:
        rgba(180,120,255,0.045);

    color:
        rgba(255,255,255,0.82);

    cursor:pointer;

    backdrop-filter:blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    box-shadow:
        0 0 24px rgba(180,120,255,0.10),
        inset 0 0 14px rgba(255,255,255,0.03);

    z-index:3000;

    transition:
        all 0.35s ease;
}


#fadeButton:hover{

    background:
        rgba(255,255,255,0.08);

    transform:
        scale(1.05);
}


#eyeIcon{
    font-size:22px;
}

#fadeLabel{

    font-size:11px;

    letter-spacing:1px;

    text-transform:uppercase;

    opacity:0.72;
}



/* =======================================
   CREDIT BUTTON
======================================= */

#creditButton{

    position:fixed;

    bottom:24px;

    right:24px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:4px;

    width:88px;

    height:74px;

    border-radius:22px;

    border:none;

    outline:none;

    background:
        rgba(180,120,255,0.045);

    color:
        rgba(255,255,255,0.82);

    cursor:pointer;

    backdrop-filter:blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    box-shadow:
        0 0 24px rgba(180,120,255,0.10),
        inset 0 0 14px rgba(255,255,255,0.03);

    z-index:3000;

    transition:
        all 0.35s ease;
}


#creditButton:hover{

    background:
        rgba(255,255,255,0.08);

    transform:
        scale(1.05);
}


#creditIcon{
    font-size:20px;
}


#creditLabel{

    font-size:11px;

    letter-spacing:1px;

    text-transform:uppercase;

    opacity:0.72;
}



/* =======================================
   CREDIT OVERLAY
======================================= */

#creditOverlay{

    position:fixed;

    inset:0;

    background:
        rgba(0,0,0,0.82);

    backdrop-filter:blur(10px);

    -webkit-backdrop-filter:
        blur(10px);

    z-index:5000;

    display:flex;

    justify-content:center;

    align-items:center;

    flex-direction:column;

    opacity:0;

    pointer-events:none;

    transition:
        opacity 0.5s ease;
}


#creditText{

    color:white;

    font-size:28px;

    text-align:center;

    line-height:1.6;

    max-width:900px;

    padding:40px;
}


#creditText a{

    color:
        rgb(220,180,255);

    text-decoration:none;
}


#backButton{

    position:absolute;

    top:30px;

    left:30px;

    background:
        rgba(255,255,255,0.08);

    color:white;

    padding:
        14px 22px;

    border-radius:18px;

    font-size:18px;

    cursor:pointer;

    backdrop-filter:blur(10px);

    transition:
        all 0.3s ease;
}


#backButton:hover{

    background:
        rgba(255,255,255,0.14);

    transform:
        scale(1.05);
}



/* =======================================
   MOBILE UI
======================================= */

@media (max-width: 900px){

    .menu-box{

        width:90vw;

        height:54px;
    }

    .menu-item{

        font-size:15px;

        padding:
            8px 12px;
    }

    #creditText{

        font-size:20px;

        padding:24px;
    }
}

</style>
</head>

<body>



<!-- =======================================
     VIDEO BACKGROUND
======================================= -->

<video
    autoplay
    muted
    loop
    playsinline
    preload="auto"
    id="bgVideo"
></video>



<!-- =======================================
     CREDIT OVERLAY
======================================= -->

<div id="creditOverlay">

    <div id="backButton">
        ← Back
    </div>

    <div id="creditText">

        The background animation is inspired by the
        visualization style used in

        <br><br>

        <a
            href="https://discsontheexe.org/"
            target="_blank"
        >
            discsontheexe.org
        </a>

    </div>

</div>



<!-- =======================================
     FLOATING MENU
======================================= -->

<div id="ui-container">

    <div class="menu-box" id="menuBox">

        <a class="menu-item" href="bio.html">
            Bio
        </a>

        <a class="menu-item" href="photography.html">
            Photography
        </a>

        <a class="menu-item" href="research.html">
            Research Work
        </a>

    </div>

</div>



<!-- =======================================
     HIDE BUTTON
======================================= -->

<button id="fadeButton">

    <div id="eyeIcon">
        ◉
    </div>

    <div id="fadeLabel">
        hide text
    </div>

</button>



<!-- =======================================
     CREDIT BUTTON
======================================= -->

<button id="creditButton">

    <div id="creditIcon">
        ⓘ
    </div>

    <div id="creditLabel">
        BG Credit
    </div>

</button>



<script>

// =======================================
// DEVICE-BASED VIDEO LOADING
// =======================================

const video =
    document.getElementById(
        'bgVideo'
    );


if(window.innerWidth < 900){

    video.innerHTML = `
        <source
            src="bkg_p.mp4"
            type="video/mp4"
        >
    `;

} else {

    video.innerHTML = `
        <source
            src="bkg_d.mp4"
            type="video/mp4"
        >
    `;
}

video.load();



// =======================================
// MENU SYSTEM
// =======================================

const menuBox =
    document.getElementById(
        'menuBox'
    );

const fadeButton =
    document.getElementById(
        'fadeButton'
    );

const fadeLabel =
    document.getElementById(
        'fadeLabel'
    );

let hiddenMode = false;


function showUI(){

    menuBox.style.opacity =
        '0.92';

    menuBox.style.pointerEvents =
        'auto';

    fadeLabel.innerText =
        'hide text';

    hiddenMode = false;
}


function hideUI(){

    menuBox.style.opacity =
        '0.03';

    menuBox.style.pointerEvents =
        'none';

    fadeLabel.innerText =
        'unhide';

    hiddenMode = true;
}


fadeButton.addEventListener(
    'click',
    ()=>{

        if(hiddenMode){

            showUI();

        } else {

            hideUI();
        }
    }
);

showUI();



// =======================================
// CREDIT SYSTEM
// =======================================

const creditButton =
    document.getElementById(
        'creditButton'
    );

const creditOverlay =
    document.getElementById(
        'creditOverlay'
    );

const backButton =
    document.getElementById(
        'backButton'
    );


creditButton.addEventListener(
    'click',
    ()=>{

        creditOverlay.style.opacity =
            '1';

        creditOverlay.style.pointerEvents =
            'auto';
    }
);


backButton.addEventListener(
    'click',
    ()=>{

        creditOverlay.style.opacity =
            '0';

        creditOverlay.style.pointerEvents =
            'none';
    }
);

</script>

</body>
</html>
