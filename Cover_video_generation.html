<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Cinematic Accretion Disk</title>

<style>

    body{
        margin:0;
        overflow:hidden;
        background:black;
    }

    canvas{
        display:block;
    }

</style>
</head>

<body>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from 'three';

import { EffectComposer }
from 'three/addons/postprocessing/EffectComposer.js';

import { RenderPass }
from 'three/addons/postprocessing/RenderPass.js';

import { UnrealBloomPass }
from 'three/addons/postprocessing/UnrealBloomPass.js';


// =====================================================
// SCENE
// =====================================================

const scene = new THREE.Scene();
scene.position.set(-3, 1, 5);

scene.fog = new THREE.FogExp2(
    0x000000,
    0.0015
);


// =====================================================
// CAMERA
// =====================================================

const camera =
    new THREE.PerspectiveCamera(
        55,
        window.innerWidth / window.innerHeight,
        0.1,
        2000
    );

camera.position.set(-10, 20, 60);

camera.rotation.z =
    THREE.MathUtils.degToRad(-30);

camera.rotation.x =
    THREE.MathUtils.degToRad(-22);

camera.rotation.y =
    THREE.MathUtils.degToRad(-5);


// =====================================================
// RENDERER
// =====================================================

const renderer =
    new THREE.WebGLRenderer({
        antialias:true,
        alpha:true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(1.2);

document.body.appendChild(
    renderer.domElement
);

renderer.autoClear = false;


// =====================================================
// DISK
// =====================================================

const discParticleCount = 700000;

const discPositions =
    new Float32Array(
        discParticleCount * 3
    );

const discColors =
    new Float32Array(
        discParticleCount * 3
    );

const initialAngles = [];
const radii = [];
const angularSpeeds = [];

const discColor =
    new THREE.Color();

for(let i=0;i<discParticleCount;i++){

    const radius =
        THREE.MathUtils.randFloat(10,40);

    const angle =
        THREE.MathUtils.randFloat(
            0,
            Math.PI*2
        );

    const height =
        THREE.MathUtils.randFloatSpread(
            4 - radius/40
        );

    discPositions[i*3] =
        radius * Math.cos(angle);

    discPositions[i*3+1] =
        height;

    discPositions[i*3+2] =
        radius * Math.sin(angle);

    initialAngles.push(angle);

    radii.push(radius);

    angularSpeeds.push(
        5 / Math.sqrt(
            radius*radius*radius - 9.5
        )
    );

    const t = radius / 40;

    discColor.setHSL(
        1.2
        + 0.1*Math.random()
        - 0.4*t,

        0.8,

        0.6 - t*0.7
    );

    discColors[i*3] =
        discColor.r;

    discColors[i*3+1] =
        discColor.g;

    discColors[i*3+2] =
        discColor.b;
}

const discGeometry =
    new THREE.BufferGeometry();

discGeometry.setAttribute(
    'position',
    new THREE.BufferAttribute(
        discPositions,
        3
    )
);

discGeometry.setAttribute(
    'color',
    new THREE.BufferAttribute(
        discColors,
        3
    )
);

const discMaterial =
    new THREE.PointsMaterial({

        size:0.1,

        vertexColors:true,

        transparent:true,

        opacity:0.14,

        depthWrite:false,

        blending:
            THREE.AdditiveBlending
    });

const disk =
    new THREE.Points(
        discGeometry,
        discMaterial
    );

disk.rotation.x =
    THREE.MathUtils.degToRad(10);

scene.add(disk);


// =====================================================
// CENTRAL STAR
// =====================================================

const star =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            2.4,
            64,
            64
        ),

        new THREE.MeshBasicMaterial({
            color:0xf4f8ff
        })
    );

scene.add(star);


// =====================================================
// GLOW
// =====================================================

const glow =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            5.5,
            64,
            64
        ),

        new THREE.MeshBasicMaterial({

            color:0xff9933,

            transparent:true,

            opacity:0.03,

            blending:
                THREE.AdditiveBlending,

            depthWrite:false
        })
    );

scene.add(glow);


// =====================================================
// CORONA
// =====================================================

const corona =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            10,
            64,
            64
        ),

        new THREE.MeshBasicMaterial({

            color:0xff5500,

            transparent:true,

            opacity:0.09,

            blending:
                THREE.AdditiveBlending,

            depthWrite:false
        })
    );

scene.add(corona);


// =====================================================
// JET AXIS
// =====================================================

const diskTilt =
    THREE.MathUtils.degToRad(10);

const jetAxis =
    new THREE.Vector3(
        0,
        Math.cos(diskTilt),
        Math.sin(diskTilt)
    ).normalize();

// =====================================================
// BASIS VECTORS
// =====================================================

const perp1 =
    new THREE.Vector3(1,0,0)
    .cross(jetAxis)
    .normalize();

const perp2 =
    jetAxis.clone()
    .cross(perp1)
    .normalize();


// =====================================================
// RELATIVISTIC JETS
// =====================================================

const jetParticleCount = 60000;

const jetPositions =
    new Float32Array(
        jetParticleCount * 3
    );

const jetColors =
    new Float32Array(
        jetParticleCount * 3
    );

const jetVelocities = [];
const jetDirections = [];
const jetOffsets = [];

const jetColor =
    new THREE.Color();

for(let i=0;i<jetParticleCount;i++){

    const dir =
        Math.random()<0.5
        ? 1
        : -1;

    const spread = 1.2;

    const r =
        Math.random()*spread;

    const theta =
        Math.random()*Math.PI*2;

    const offset =
        perp1.clone()
        .multiplyScalar(
            r*Math.cos(theta)
        )

        .add(
            perp2.clone()
            .multiplyScalar(
                r*Math.sin(theta)
            )
        );

    const launch =
        dir*Math.random()*180;

    const base =
        jetAxis.clone()
        .multiplyScalar(launch);

    const pos =
        base.add(offset);

    jetPositions[i*3] = pos.x;
    jetPositions[i*3+1] = pos.y;
    jetPositions[i*3+2] = pos.z;

    jetVelocities.push(
        dir * (
            0.5
            + Math.random()*0.7
        )
    );

    jetDirections.push(dir);

    jetOffsets.push(offset);

    jetColor.setHSL(
        0.78,
        1.0,
        0.62
    );

    const brightness =
        dir === 1
        ? 1.0
        : 0.2;

    jetColors[i*3] =
        jetColor.r * brightness;

    jetColors[i*3+1] =
        jetColor.g * brightness;

    jetColors[i*3+2] =
        jetColor.b * brightness;
}

const jetGeometry =
    new THREE.BufferGeometry();

jetGeometry.setAttribute(
    'position',
    new THREE.BufferAttribute(
        jetPositions,
        3
    )
);

jetGeometry.setAttribute(
    'color',
    new THREE.BufferAttribute(
        jetColors,
        3
    )
);

const jetMaterial =
    new THREE.PointsMaterial({

        size:0.12,

        vertexColors:true,

        transparent:true,

        opacity:0.42,

        depthWrite:false,

        blending:
            THREE.AdditiveBlending
    });

const jets =
    new THREE.Points(
        jetGeometry,
        jetMaterial
    );

scene.add(jets);


// =====================================================
// BACKGROUND STARS
// =====================================================

const starCount = 50000;

const bgPositions =
    new Float32Array(
        starCount * 3
    );

const bgColors =
    new Float32Array(
        starCount * 3
    );

const bgColor =
    new THREE.Color();

for(let i=0;i<starCount;i++){

    const radius = 800;

    bgPositions[i*3] =
        THREE.MathUtils.randFloatSpread(radius);

    bgPositions[i*3+1] =
        THREE.MathUtils.randFloatSpread(radius);

    bgPositions[i*3+2] =
        THREE.MathUtils.randFloatSpread(radius);

    const brightness =
        Math.random();

    bgColor.setRGB(
        0.7 + brightness*0.3,
        0.7 + brightness*0.3,
        1.0
    );

    bgColors[i*3] =
        bgColor.r;

    bgColors[i*3+1] =
        bgColor.g;

    bgColors[i*3+2] =
        bgColor.b;
}

const bgGeometry =
    new THREE.BufferGeometry();

bgGeometry.setAttribute(
    'position',
    new THREE.BufferAttribute(
        bgPositions,
        3
    )
);

bgGeometry.setAttribute(
    'color',
    new THREE.BufferAttribute(
        bgColors,
        3
    )
);

const bgMaterial =
    new THREE.PointsMaterial({

        size:0.55,

        vertexColors:true,

        transparent:true,

        opacity:0.9,

        depthWrite:false,

        blending:
            THREE.AdditiveBlending
    });

const backgroundStars =
    new THREE.Points(
        bgGeometry,
        bgMaterial
    );

scene.add(backgroundStars);


// =====================================================
// BLOOM
// =====================================================

const composer =
    new EffectComposer(renderer);

composer.addPass(
    new RenderPass(scene,camera)
);

composer.addPass(
    new UnrealBloomPass(
        new THREE.Vector2(
            window.innerWidth,
            window.innerHeight
        ),
        1.1,
        0.35,
        0.08
    )
);


// =====================================================
// CLOCK
// =====================================================

const clock =
    new THREE.Clock();


// =====================================================
// ANIMATION
// =====================================================

function animate(){

    requestAnimationFrame(animate);

    const elapsedTime =
        clock.getElapsedTime();


    // =========================================
    // DISK ROTATION
    // =========================================

    const pos =
        discGeometry.attributes.position.array;

    for(let i=0;i<discParticleCount;i++){

        let angle =
            initialAngles[i]
            - angularSpeeds[i]
            * elapsedTime;

        let r = radii[i];

        pos[i*3] =
            r*Math.cos(angle);

        pos[i*3+2] =
            r*Math.sin(angle);
    }

    discGeometry
        .attributes
        .position
        .needsUpdate = true;


    // =========================================
    // JET MOTION
    // =========================================

    const jetPos =
        jetGeometry.attributes.position.array;

    for(let i=0;i<jetParticleCount;i++){

        const dir =
            jetDirections[i];

        const speed =
            jetVelocities[i];

        jetPos[i*3] +=
            jetAxis.x * speed;

        jetPos[i*3+1] +=
            jetAxis.y * speed;

        jetPos[i*3+2] +=
            jetAxis.z * speed;

        const dist =
            Math.sqrt(
                jetPos[i*3]**2 +
                jetPos[i*3+1]**2 +
                jetPos[i*3+2]**2
            );

        const widen =
            0.012 * dist;

        jetPos[i*3] +=
            (Math.random()-0.5)
            * widen;

        jetPos[i*3+1] +=
            (Math.random()-0.5)
            * widen;

        jetPos[i*3+2] +=
            (Math.random()-0.5)
            * widen;

        if(dist > 220){

            const launch =
                dir*Math.random()*2;

            const base =
                jetAxis.clone()
                .multiplyScalar(launch);

            const offset =
                jetOffsets[i];

            const p =
                base.add(offset);

            jetPos[i*3] = p.x;
            jetPos[i*3+1] = p.y;
            jetPos[i*3+2] = p.z;
        }
    }

    jetGeometry
        .attributes
        .position
        .needsUpdate = true;


    // =========================================
    // CINEMATIC ROTATION
    // =========================================

    disk.rotation.y += 0.00;

    jets.rotation.y += 0.00;


    // =========================================
    // BACKGROUND STAR MOTION
    // =========================================

    backgroundStars.rotation.y += 0.00012;

    backgroundStars.rotation.x += 0.00002;


    // =========================================
    // PULSING GLOW
    // =========================================

    glow.scale.setScalar(
        1
        + 0.04*Math.sin(
            elapsedTime*2
        )
    );

    corona.scale.setScalar(
        1
        + 0.02*Math.sin(
            elapsedTime*1.5
        )
    );


    renderer.clear();

    composer.render();
}

animate();


// =====================================================
// RESIZE
// =====================================================

window.addEventListener(
    'resize',
    ()=>{

        camera.aspect =
            window.innerWidth
            / window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
