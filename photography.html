<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Astrophotography | Sujoy Karmakar</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    overflow-x:hidden;

    background:black;

    color:white;

    font-family:'Inter',sans-serif;
}

canvas{

    position:fixed;

    inset:0;

    z-index:0;

    display:block;
}



/* =======================================
   PAGE LAYOUT
======================================= */

#page{

    position:relative;

    z-index:10;

    max-width:1200px;

    margin:0 auto;

    padding:120px 24px 100px;

    animation:fadeIn 2s ease;
}


.page-title{

    font-family:'Orbitron',sans-serif;

    font-size:42px;

    font-weight:700;

    letter-spacing:3px;

    line-height:1.3;

    margin:0 0 12px;

    text-align:center;

    text-shadow:0 0 20px rgba(180,120,255,0.35);
}


.page-subtitle{

    font-size:15px;

    letter-spacing:2px;

    text-transform:uppercase;

    color:rgba(220,200,255,0.7);

    margin:0 0 90px;

    text-align:center;
}



/* =======================================
   SECTIONS
======================================= */

.section{

    margin-bottom:110px;
}


.section-head{

    text-align:center;

    margin-bottom:46px;
}


.section-emoji{

    font-size:40px;

    filter:drop-shadow(0 0 12px rgba(200,160,255,0.6));
}


.section-title{

    font-family:'Orbitron',sans-serif;

    font-size:30px;

    font-weight:500;

    letter-spacing:2px;

    margin:14px 0 12px;
}


.section-intro{

    font-size:16px;

    line-height:1.7;

    color:rgba(255,255,255,0.7);

    max-width:620px;

    margin:0 auto;
}


.divider{

    height:1px;

    width:min(600px,80%);

    margin:0 auto 110px;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(200,150,255,0.7),
        transparent
    );

    box-shadow:0 0 18px rgba(200,150,255,0.6);
}



/* =======================================
   GALLERY
======================================= */

.gallery{

    display:flex;

    flex-wrap:wrap;

    justify-content:center;

    gap:30px;
}


.gallery > .photo-card{

    width:calc((100% - 60px) / 3);
}


@media(max-width:1000px){

    .gallery > .photo-card{

        width:calc((100% - 30px) / 2);
    }
}


.photo-card{

    border-radius:30px;

    overflow:hidden;

    cursor:pointer;

    background:rgba(160,83,199,0.045);

    border:1px solid rgba(255,255,255,0.10);

    backdrop-filter:blur(18px);

    -webkit-backdrop-filter:blur(18px);

    box-shadow:
        0 0 40px rgba(202,92,227,0.22),
        inset 0 0 25px rgba(190,149,228,0.30);

    opacity:0;

    transform:translateY(30px);

    transition:
        opacity 1.2s ease,
        transform 0.5s ease,
        box-shadow 0.4s ease;
}


.photo-card.visible{

    opacity:1;

    transform:translateY(0);
}


.photo-card.visible:hover{

    transform:translateY(-8px) scale(1.02);

    box-shadow:
        0 0 50px rgba(180,120,255,0.45),
        0 0 90px rgba(181,120,255,0.30),
        inset 0 0 30px rgba(190,149,228,0.45);
}


.photo-frame{

    position:relative;

    aspect-ratio:3/4;

    overflow:hidden;

    background:black;
}


.photo-frame.landscape{

    aspect-ratio:4/3;
}


.zoom-layer{

    position:absolute;
}


.zoom-layer img{

    width:100%;

    height:100%;

    object-fit:cover;

    display:block;

    transition:transform 0.6s ease;
}


.photo-card:hover .zoom-layer img{

    transform:scale(1.05);
}


.collage{

    position:absolute;

    inset:0;

    display:flex;

    flex-direction:column;

    gap:3px;

    background:rgba(200,150,255,0.35);
}


.collage.grid{

    display:grid;

    grid-template-columns:1fr 1fr;

    grid-template-rows:1fr 1fr;
}


.collage-tile{

    position:relative;

    flex:1;

    overflow:hidden;

    background:black;
}


.marks{

    position:absolute;

    inset:0;

    width:100%;

    height:100%;

    pointer-events:none;

    opacity:0;

    transition:opacity 0.6s ease;

    filter:drop-shadow(0 0 6px rgba(255,120,200,0.6));
}


.show-marks .marks{

    opacity:1;
}


.photo-info{

    padding:22px 24px 26px;
}


.photo-title{

    font-family:'Orbitron',sans-serif;

    font-size:17px;

    letter-spacing:1px;

    margin-bottom:12px;
}


.chips{

    display:flex;

    flex-wrap:wrap;

    gap:8px;
}


.chip{

    font-size:12px;

    padding:5px 11px;

    border-radius:12px;

    color:rgba(230,215,255,0.85);

    background:rgba(255,255,255,0.06);

    border:1px solid rgba(255,255,255,0.08);
}


.empty-note{

    text-align:center;

    padding:46px 24px;

    border-radius:30px;

    max-width:520px;

    margin:0 auto;

    color:rgba(255,255,255,0.6);

    background:rgba(160,83,199,0.035);

    border:1px dashed rgba(255,255,255,0.14);
}



/* =======================================
   LIGHTBOX
======================================= */

#lightbox{

    position:fixed;

    inset:0;

    z-index:5000;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:30px;

    background:rgba(0,0,0,0.82);

    backdrop-filter:blur(10px);

    -webkit-backdrop-filter:blur(10px);

    opacity:0;

    pointer-events:none;

    transition:opacity 0.4s ease;
}


#lightbox.open{

    opacity:1;

    pointer-events:auto;
}


.lb-inner{

    display:flex;

    gap:30px;

    align-items:center;

    max-width:1250px;

    width:100%;

    max-height:100%;
}


.lb-media{

    position:relative;

    overflow:hidden;

    flex-shrink:0;

    border-radius:20px;

    background:black;

    box-shadow:0 0 50px rgba(180,120,255,0.25);
}


.lb-media.portrait{

    height:min(88vh, 62vw * 4 / 3);

    width:calc(min(88vh, 62vw * 4 / 3) * 3 / 4);
}


.lb-media.landscape{

    width:min(62vw, 88vh * 4 / 3);

    height:calc(min(62vw, 88vh * 4 / 3) * 3 / 4);
}


.lb-details{

    flex:1;

    max-height:88vh;

    overflow-y:auto;

    padding:30px;

    border-radius:26px;

    background:rgba(160,83,199,0.06);

    border:1px solid rgba(255,255,255,0.10);
}


.lb-title{

    font-family:'Orbitron',sans-serif;

    font-size:24px;

    margin:0 0 8px;
}


.lb-sub{

    color:rgba(220,200,255,0.7);

    font-size:14px;

    letter-spacing:1px;

    margin-bottom:24px;
}


.lb-row{

    display:flex;

    justify-content:space-between;

    gap:20px;

    padding:11px 0;

    border-bottom:1px solid rgba(255,255,255,0.07);

    font-size:14px;
}


.lb-row span:first-child{

    color:rgba(210,180,255,0.85);

    letter-spacing:1px;

    text-transform:uppercase;

    font-size:12px;

    padding-top:2px;

    white-space:nowrap;
}


.lb-row span:last-child{

    text-align:right;

    color:rgba(255,255,255,0.88);

    line-height:1.5;
}


.lb-text{

    margin-top:22px;

    line-height:1.8;

    font-size:15px;

    color:rgba(255,255,255,0.8);
}


.lb-mark-btn{

    margin-top:22px;

    padding:11px 18px;

    border-radius:14px;

    border:1px solid rgba(255,255,255,0.12);

    background:rgba(255,255,255,0.06);

    color:white;

    font-family:'Inter',sans-serif;

    font-size:14px;

    cursor:pointer;

    transition:all 0.3s ease;
}


.lb-mark-btn:hover,
.lb-mark-btn.active{

    background:rgba(255,140,210,0.16);

    border-color:rgba(255,170,220,0.5);

    box-shadow:0 0 18px rgba(255,140,210,0.3);
}


.lb-views{

    display:flex;

    gap:12px;

    margin-top:24px;

    flex-wrap:wrap;
}


.lb-thumb{

    width:64px;

    height:85px;

    border-radius:12px;

    overflow:hidden;

    cursor:pointer;

    position:relative;

    border:2px solid transparent;

    opacity:0.55;

    transition:all 0.3s ease;
}


.lb-thumb.landscape{

    width:96px;

    height:72px;
}


.lb-thumb:hover{

    opacity:0.85;
}


.lb-thumb.active{

    opacity:1;

    border-color:rgba(210,170,255,0.9);

    box-shadow:0 0 14px rgba(180,120,255,0.5);
}


.lb-close{

    position:fixed;

    top:24px;

    right:24px;

    width:52px;

    height:52px;

    border-radius:18px;

    border:1px solid rgba(255,255,255,0.12);

    background:rgba(255,255,255,0.06);

    color:white;

    font-size:22px;

    cursor:pointer;

    transition:all 0.3s ease;
}


.lb-close:hover{

    background:rgba(255,255,255,0.14);

    transform:scale(1.06);
}



/* =======================================
   BACK BUTTON
======================================= */

.back-button{

    position:fixed;

    top:26px;

    left:26px;

    padding:14px 22px;

    border-radius:18px;

    text-decoration:none;

    color:white;

    background:rgba(255,255,255,0.05);

    border:1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(12px);

    -webkit-backdrop-filter:blur(12px);

    z-index:3000;

    animation:fadeIn 2s ease;

    transition:all 0.35s ease;
}


.back-button:hover{

    background:rgba(255,255,255,0.10);

    transform:translateY(-2px);
}



/* =======================================
   MOBILE
======================================= */

@media(max-width:768px){

    #page{
        padding:100px 16px 70px;
    }

    .page-title{
        font-size:26px;
    }

    .page-subtitle{

        font-size:12px;

        margin-bottom:60px;
    }

    .section-title{
        font-size:22px;
    }

    .gallery{

        gap:24px;
    }

    .gallery > .photo-card{

        width:100%;
    }

    .lb-inner{

        flex-direction:column;

        overflow-y:auto;

        max-height:92vh;
    }

    .lb-media.portrait{

        width:min(100%, 60vh * 3 / 4);

        height:auto;

        aspect-ratio:3/4;
    }

    .lb-media.landscape{

        width:100%;

        height:auto;

        aspect-ratio:4/3;
    }

    .lb-details{

        max-height:none;

        overflow:visible;

        width:100%;

        padding:22px;
    }

    .back-button{

        top:18px;

        left:18px;

        padding:12px 18px;
    }

    .lb-close{

        top:14px;

        right:14px;
    }
}



/* =======================================
   ANIMATION
======================================= */

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0px);
    }
}

</style>
</head>

// =======================================
// MEDIA (photo + optional zoom + markings)
// =======================================

function mediaHTML(v, lazy, opts = {}){

    const frameAspect = opts.frameAspect ||
        (v.orientation === 'landscape' ? 4/3 : 3/4);

    const imgAspect = v.aspect || frameAspect;

    const z = opts.zoom || v.zoom || 1;

    const f = opts.focus || v.focus || [0.5, 0.5];

    // size of the photo relative to the frame (cover, then zoom)
    const w = z * Math.max(1, imgAspect / frameAspect);

    const h = z * Math.max(1, frameAspect / imgAspect);

    const left = Math.min(0, Math.max(1 - w, 0.5 - f[0] * w)) * 100;

    const top = Math.min(0, Math.max(1 - h, 0.5 - f[1] * h)) * 100;

    let marks = '';

    if(v.markings && (!opts.card || opts.marks)){

        const m = v.markings;

        const body = (opts.card && m.svgCard) ? m.svgCard : m.svg;

        marks = `
            <svg class="marks" viewBox="0 0 ${m.width} ${m.height}"
                 preserveAspectRatio="xMidYMid slice"
                 fill="none" stroke="rgba(255,175,225,0.95)" stroke-width="7"
                 stroke-linecap="round">
                <g style="font-family:Inter,sans-serif;font-size:${opts.card ? 80 : 66}px;font-weight:600;letter-spacing:1px">
                    ${body.replace(/<text /g,
                        '<text fill="rgba(255,205,235,1)" stroke="none" ')}
                </g>
            </svg>`;
    }

    return `
        <div class="zoom-layer ${opts.card && opts.marks ? 'show-marks' : ''}"
             style="width:${w*100}%;height:${h*100}%;left:${left}%;top:${top}%">
            <img src="${v.image}" alt="" ${lazy ? 'loading="lazy"' : ''}>
            ${marks}
        </div>`;
}



// =======================================
// COLLAGE (several shots stacked in one card)
// =======================================

function collageHTML(p){

    const n = p.collage.length;

    const grid = (n === 4);

    // relative heights of stacked tiles (default: equal)
    const total = p.collage.reduce((t, c) => t + (c.height || 1), 0);

    return `<div class="collage ${grid ? 'grid' : ''}">` +
        p.collage.map(c => {

            // each tile's shape inside a 3:4 card
            const frameAspect = grid ? 3/4 : 3/4 * total / (c.height || 1);

            return `
            <div class="collage-tile" style="flex:${c.height || 1}">
                ${mediaHTML(p.views[c.view], true,
                    { frameAspect, zoom: c.zoom, focus: c.focus,
                      card: true, marks: c.marks })}
            </div>`;
        }).join('') +
        `</div>`;
}



// =======================================
// BUILD GALLERIES
// =======================================

function buildGallery(containerId, photos){

    const box = document.getElementById(containerId);

    if(photos.length === 0){

        box.outerHTML =
            '<div class="empty-note">Photos coming soon ✨</div>';

        return;
    }

    photos.forEach(p => {

        const cover = p.views[0];

        const card = document.createElement('div');

        card.className = 'photo-card';

        card.innerHTML = `
            <div class="photo-frame ${cover.orientation === 'landscape' ? 'landscape' : 'portrait'}">
                ${p.collage ? collageHTML(p) : mediaHTML(cover, true)}
            </div>
            <div class="photo-info">
                <div class="photo-title">${p.title}</div>
                <div class="chips">
                    ${(p.chips||[]).map(c => `<span class="chip">${c}</span>`).join('')}
                </div>
            </div>`;

        card.addEventListener('click', () => openLightbox(p, 0));

        box.appendChild(card);
    });
}

// =======================================
// REVEAL ON SCROLL
// =======================================

const observer = new IntersectionObserver(entries => {

    entries.forEach(e => {

        if(e.isIntersecting){

            e.target.classList.add('visible');

            observer.unobserve(e.target);
        }
    });

}, { threshold:0.15 });

document.querySelectorAll('.photo-card').forEach(c => observer.observe(c));



// =======================================
// LIGHTBOX
// =======================================

const lightbox = document.getElementById('lightbox');

const lbMedia = document.getElementById('lbMedia');

const lbMarkBtn = document.getElementById('lbMarkBtn');

let current = null;

let currentIndex = 0;

let marksOn = false;


function setMarks(on){

    marksOn = on;

    lbMedia.classList.toggle('show-marks', on);

    lbMarkBtn.classList.toggle('active', on);

    lbMarkBtn.textContent = on ? '✎ Hide markings' : '✎ Show markings';
}


function showView(i){

    currentIndex = i;

    const v = current.views[i];

    const orient = v.orientation === 'landscape' ? 'landscape' : 'portrait';

    lbMedia.className = 'lb-media ' + orient;

    lbMedia.innerHTML = mediaHTML(v, false);

    document.getElementById('lbTitle').textContent = current.title;

    document.getElementById('lbSub').textContent =
        [v.caption, v.subtitle].filter(Boolean).join(' — ');

    document.getElementById('lbRows').innerHTML =
        (v.details||[]).map(([k,val]) =>
            `<div class="lb-row"><span>${k}</span><span>${val}</span></div>`
        ).join('');

    document.getElementById('lbText').textContent = v.text || '';

    lbMarkBtn.style.display = v.markings ? '' : 'none';

    setMarks(!!v.markings);

    const views = document.getElementById('lbViews');

    if(current.views.length > 1){

        views.innerHTML = current.views.map((cv, j) => `
            <div class="lb-thumb ${cv.orientation === 'landscape' ? 'landscape' : ''} ${j === i ? 'active' : ''}"
                 data-i="${j}">
                ${mediaHTML(cv, false)}
            </div>`).join('');

        views.querySelectorAll('.lb-thumb').forEach(t =>
            t.addEventListener('click', () => showView(+t.dataset.i)));

    } else {

        views.innerHTML = '';
    }
}


function openLightbox(p, i){

    current = p;

    showView(i);

    lightbox.classList.add('open');

    document.body.style.overflow = 'hidden';
}


function closeLightbox(){

    lightbox.classList.remove('open');

    document.body.style.overflow = '';
}


lbMarkBtn.addEventListener('click', () => setMarks(!marksOn));

document.getElementById('lbClose').addEventListener('click', closeLightbox);

lightbox.addEventListener('click', e => {

    if(e.target === lightbox) closeLightbox();
});

document.addEventListener('keydown', e => {

    if(!lightbox.classList.contains('open')) return;

    if(e.key === 'Escape') closeLightbox();

    const n = current.views.length;

    if(e.key === 'ArrowRight' && n > 1) showView((currentIndex + 1) % n);

    if(e.key === 'ArrowLeft' && n > 1) showView((currentIndex - 1 + n) % n);
});

</script>



<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",

<script type="module">

import * as THREE from 'three';

import { EffectComposer }
from 'three/addons/postprocessing/EffectComposer.js';

import { RenderPass }
from 'three/addons/postprocessing/RenderPass.js';

import { UnrealBloomPass }
from 'three/addons/postprocessing/UnrealBloomPass.js';



// =======================================
// SCENE
// =======================================

const scene = new THREE.Scene();

scene.fog = new THREE.FogExp2(
    0x000000,
    0.0009
);



// =======================================
// CAMERA
// =======================================

const camera =
    new THREE.PerspectiveCamera(
        90,
        window.innerWidth/window.innerHeight,
        0.1,
        1000
    );

camera.position.set(-5,10,100);

camera.rotation.z =
    THREE.MathUtils.degToRad(-30);

camera.rotation.x =
    THREE.MathUtils.degToRad(-25);

camera.rotation.y =
    THREE.MathUtils.degToRad(-5);



// =======================================
// RENDERER
// =======================================

const renderer =
    new THREE.WebGLRenderer({

        antialias:true,

        alpha:true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(1.2);

document.body.appendChild(
    renderer.domElement
);

renderer.autoClear = false;



// =======================================
// STARFIELD
// =======================================

const starGeometry =
    new THREE.BufferGeometry();

const starCount = 25000;

const starPositions =
    new Float32Array(starCount*3);

for(let i=0;i<starCount;i++){

    starPositions[i*3] =
        (Math.random()-0.5)*700;

    starPositions[i*3+1] =
        (Math.random()-0.5)*700;

    starPositions[i*3+2] =
        (Math.random()-0.5)*700;
}

starGeometry.setAttribute(
    'position',
    new THREE.BufferAttribute(
        starPositions,
        3
    )
);

const starMaterial =
    new THREE.PointsMaterial({

        color:0xdcc7ff,

        size:0.65,

        transparent:true,

        opacity:0.8
    });

const stars =
    new THREE.Points(
        starGeometry,
        starMaterial
    );

scene.add(stars);



// =======================================
// DISK
// =======================================

const discParticleCount = 35000;

const positions =
    new Float32Array(
        discParticleCount*3
    );

const colors =
    new Float32Array(
        discParticleCount*3
    );

const color =
    new THREE.Color();

const initialAngles = [];
const radii = [];
const angularSpeeds = [];

for(let i=0;i<discParticleCount;i++){

    const radius =
        THREE.MathUtils.randFloat(10,40);

    const angle =
        THREE.MathUtils.randFloat(
            0,
            2*Math.PI
        );

    const height =
        THREE.MathUtils.randFloatSpread(
            4-radius/40
        );

    positions[i*3] =
        radius*Math.cos(angle);

    positions[i*3+1] =
        height;

    positions[i*3+2] =
        radius*Math.sin(angle);

    initialAngles.push(angle);

    radii.push(radius);

    angularSpeeds.push(
        35/Math.sqrt(
            radius*radius*radius-9.5
        )
    );

    const t = radius/40;

    color.setHSL(
        1.2
        +0.1*Math.random()
        -0.4*t,

        0.8,

        0.6-t*0.7
    );

    colors.set(
        [color.r,color.g,color.b],
        i*3
    );
}


const discGeometry =
    new THREE.BufferGeometry();

discGeometry.setAttribute(
    'position',
    new THREE.BufferAttribute(
        positions,
        3
    )
);

discGeometry.setAttribute(
    'color',
    new THREE.BufferAttribute(
        colors,
        3
    )
);

const discMaterial =
    new THREE.PointsMaterial({

        size:0.18,

        vertexColors:true,

        transparent:true,

        opacity:0.22,

        depthWrite:false,

        blending:
            THREE.AdditiveBlending
    });

const disc =
    new THREE.Points(
        discGeometry,
        discMaterial
    );

disc.rotation.x =
    THREE.MathUtils.degToRad(10);

scene.add(disc);



// =======================================
// CENTRAL STAR
// =======================================

const star =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            2.2,
            64,
            64
        ),

        new THREE.MeshBasicMaterial({
            color:0xfafcff
        })
    );

scene.add(star);



// =======================================
// GLOW
// =======================================

const glow =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            4.5,
            64,
            64
        ),

        new THREE.MeshBasicMaterial({

            color:0xffaa33,

            transparent:true,

            opacity:0.015,

            blending:
                THREE.AdditiveBlending,

            depthWrite:false
        })
    );

scene.add(glow);



// =======================================
// JET AXIS
// =======================================

const diskTilt =
    THREE.MathUtils.degToRad(10);

const jetAxis =
    new THREE.Vector3(
        0,
        Math.cos(diskTilt),
        Math.sin(diskTilt)
    ).normalize();



// =======================================
// BASIS VECTORS
// =======================================

const perp1 =
    new THREE.Vector3(1,0,0)
    .cross(jetAxis)
    .normalize();

const perp2 =
    jetAxis.clone()
    .cross(perp1)
    .normalize();



// =======================================
// COLLIMATED JETS
// =======================================

const jetParticleCount = 8000;

const jetPositions =
    new Float32Array(
        jetParticleCount * 3
    );

const jetColors =
    new Float32Array(
        jetParticleCount * 3
    );

const jetVelocities = [];
const jetDirections = [];
const jetOffsets = [];

const jetColor =
    new THREE.Color();

for(let i=0;i<jetParticleCount;i++){

    const dir =
        Math.random()<0.5
        ? 1
        : -1;

    const spread = 1;

    const r =
        Math.random()*spread;

    const theta =
        Math.random()*2*Math.PI;

    const offset =
        perp1.clone()
        .multiplyScalar(
            r*Math.cos(theta)
        )

        .add(
            perp2.clone()
            .multiplyScalar(
                r*Math.sin(theta)
            )
        );

    const launch =
        dir*Math.random()*140;

    const base =
        jetAxis.clone()
        .multiplyScalar(launch);

    const pos =
        base.add(offset);

    jetPositions[i*3] = pos.x;
    jetPositions[i*3+1] = pos.y;
    jetPositions[i*3+2] = pos.z;

    jetVelocities.push(
        dir * (
            0.45
            + Math.random()*0.55
        )
    );

    jetDirections.push(dir);

    jetOffsets.push(offset);

    jetColor.setHSL(
        0.78,
        1.0,
        0.6
    );

    const brightness =
        dir === 1
        ? 1.0
        : 0.18;

    jetColors[i*3] =
        jetColor.r * brightness;

    jetColors[i*3+1] =
        jetColor.g * brightness;

    jetColors[i*3+2] =
        jetColor.b * brightness;
}


const jetGeometry =
    new THREE.BufferGeometry();

jetGeometry.setAttribute(
    'position',
    new THREE.BufferAttribute(
        jetPositions,
        3
    )
);

jetGeometry.setAttribute(
    'color',
    new THREE.BufferAttribute(
        jetColors,
        3
    )
);

const jetMaterial =
    new THREE.PointsMaterial({

        size:0.25,

        vertexColors:true,

        transparent:true,

        opacity:0.35,

        depthWrite:false,

        blending:
            THREE.AdditiveBlending
    });

const jets =
    new THREE.Points(
        jetGeometry,
        jetMaterial
    );

scene.add(jets);



// =======================================
// MOVE WHOLE SYSTEM
// =======================================

const systemOffset =
    new THREE.Vector3(
        10,
        -12,
        5
    );

disc.position.copy(systemOffset);

star.position.copy(systemOffset);

glow.position.copy(systemOffset);

jets.position.copy(systemOffset);



// =======================================
// BLOOM
// =======================================

const composer =
    new EffectComposer(renderer);

composer.addPass(
    new RenderPass(scene,camera)
);

composer.addPass(
    new UnrealBloomPass(

        new THREE.Vector2(
            window.innerWidth,
            window.innerHeight
        ),

        0.9,
        0.35,
        0.12
    )
);



// =======================================
// ANIMATION
// =======================================

function animate(){

    requestAnimationFrame(
        animate
    );

    const elapsedTime =
        performance.now()*0.0001;



    // =======================================
    // CAMERA DRIFT
    // =======================================

    camera.position.x =
        -5
        + Math.sin(performance.now()*0.00008)*1.5;

    camera.position.y =
        10
        + Math.cos(performance.now()*0.00006)*1.2;



    // =======================================
    // STARFIELD
    // =======================================

    stars.rotation.y += 0.00008;

    stars.material.opacity =
        0.65
        + 0.15*Math.sin(
            performance.now()*0.00025
        );



    // =======================================
    // DISK ROTATION
    // =======================================

    const pos =
        discGeometry.attributes.position.array;

    for(let i=0;i<discParticleCount;i++){

        let angle =
            initialAngles[i]
            - angularSpeeds[i]
            * elapsedTime;

        let r = radii[i];

        pos[i*3] =
            r*Math.cos(angle);

        pos[i*3+2] =
            r*Math.sin(angle);
    }

    discGeometry
        .attributes
        .position
        .needsUpdate = true;



    // =======================================
    // STAR PULSE
    // =======================================

    star.material.opacity =
        0.68
        + 0.16*Math.sin(
            performance.now()*0.0007
        );



    // =======================================
    // JET ANIMATION
    // =======================================

    const jetPos =
        jetGeometry.attributes.position.array;

    for(let i=0;i<jetParticleCount;i++){

        const dir =
            jetDirections[i];

        const speed =
            jetVelocities[i];

        jetPos[i*3] +=
            jetAxis.x * speed;

        jetPos[i*3+1] +=
            jetAxis.y * speed;

        jetPos[i*3+2] +=
            jetAxis.z * speed;

        const dist =
            Math.sqrt(
                jetPos[i*3]**2 +
                jetPos[i*3+1]**2 +
                jetPos[i*3+2]**2
            );

        const widen =
            0.08 * dist;

        jetPos[i*3] +=
            (Math.random()-0.5)
            * widen;

        jetPos[i*3+1] +=
            (Math.random()-0.5)
            * widen;

        jetPos[i*3+2] +=
            (Math.random()-0.5)
            * widen;

        if(dist > 140){

            const launch =
                dir*Math.random()*2;

            const base =
                jetAxis.clone()
                .multiplyScalar(launch);

            const offset =
                jetOffsets[i];

            const p =
                base.add(offset);

            jetPos[i*3] = p.x;
            jetPos[i*3+1] = p.y;
            jetPos[i*3+2] = p.z;
        }
    }

    jetGeometry
        .attributes
        .position
        .needsUpdate = true;



    // =======================================
    // BLOOM PULSE
    // =======================================

    composer.passes[1].strength =
        0.9
        + 0.08*Math.sin(
            performance.now()*0.001
        );



    renderer.clear();

    composer.render();
}

animate();



// =======================================
// RESIZE
// =======================================

window.addEventListener(
    'resize',
    ()=>{

        camera.aspect =
            window.innerWidth
            /window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>
